name: PrimedRTP
version: '${version}'
main: io.github.editid0.primedrtp.PrimedRTP
api-version: '26.3'
folia-supported: true
description: Lag-free random teleport with pre-generated, pre-loaded destination pools.
authors: [editid0]
softdepend: [Vault, PlaceholderAPI, WorldGuard, GriefPrevention]

permissions:
  primedrtp.use:
    description: Use /rtp.
    default: true
  primedrtp.gui:
    description: Open the RTP world selector menu.
    default: true
  primedrtp.world.*:
    description: RTP into every world that requires a permission.
    default: op
  primedrtp.others:
    description: Random-teleport other players (/rtp <world> <player>).
    default: op
  primedrtp.sign.use:
    description: Use RTP signs.
    default: true
  primedrtp.sign.create:
    description: Create RTP signs.
    default: op
  primedrtp.bypass.cooldown:
    description: Ignore RTP cooldowns.
    default: op
  primedrtp.bypass.cost:
    description: Ignore RTP costs.
    default: op
  primedrtp.bypass.warmup:
    description: Teleport without warmup.
    default: op
  primedrtp.admin:
    description: /rtp admin (reload, pool, cooldown, info).
    default: op
    children:
      primedrtp.others: true
  primedrtp.*:
    description: Everything.
    default: false
    children:
      primedrtp.use: true
      primedrtp.gui: true
      primedrtp.world.*: true
      primedrtp.others: true
      primedrtp.sign.use: true
      primedrtp.sign.create: true
      primedrtp.bypass.cooldown: true
      primedrtp.bypass.cost: true
      primedrtp.bypass.warmup: true
      primedrtp.admin: true
